name: 🐛 Rapport de bug
description: Signaler un problème de fonctionnement de Mfolio
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de remplir ce formulaire — plus c'est précis, plus le correctif sera rapide.

  - type: input
    id: version
    attributes:
      label: Version
      description: Version de Mfolio (voir `package.json` → `version`)
      placeholder: ex. 1.0.0
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Freebuff Web (plateforme)
        - Vercel / Netlify / autre hébergeur
        - Local (bun run dev)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: Qu'est-ce qui se passe ?
      description: Décrivez le problème constaté.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
      description: Ce qui aurait dû se produire.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      description: Le chemin exact pour reproduire le bug.
      placeholder: |
        1. Aller sur « … »
        2. Cliquer sur « … »
        3. Constater l'erreur
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Messages d'erreur / captures
      description: Coller la console du navigateur, les logs Convex, ou joindre une capture d'écran.
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Navigateur
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Autre / mobile
    validations:
      required: false
